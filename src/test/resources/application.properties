spring.application.name=TransferPlaylists

spotify.client.id=test-spotify-id
spotify.client.secret=test-spotify-secret
spotify.redirect.uri=http://localhost:8080/login/oauth2/code/spotify

google.client.id=test-google-id
google.client.secret=test-google-secret
google.redirect.uri=http://localhost:8080/login/oauth2/code/google

spring.security.oauth2.client.registration.spotify.client-id=${spotify.client.id}
spring.security.oauth2.client.registration.spotify.client-secret=${spotify.client.secret}
spring.security.oauth2.client.registration.spotify.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.spotify.redirect-uri=${spotify.redirect.uri}
spring.security.oauth2.client.registration.spotify.scope=playlist-read-private,playlist-read-collaborative
spring.security.oauth2.client.provider.spotify.authorization-uri=https://accounts.spotify.com/authorize
spring.security.oauth2.client.provider.spotify.token-uri=https://accounts.spotify.com/api/token
spring.security.oauth2.client.provider.spotify.user-info-uri=https://api.spotify.com/v1/me
spring.security.oauth2.client.provider.spotify.user-name-attribute=id

spring.security.oauth2.client.registration.google.client-id=${google.client.id}
spring.security.oauth2.client.registration.google.client-secret=${google.client.secret}
spring.security.oauth2.client.registration.google.scope=https://www.googleapis.com/auth/youtube.force-ssl
spring.security.oauth2.client.registration.google.redirect-uri=${google.redirect.uri}
